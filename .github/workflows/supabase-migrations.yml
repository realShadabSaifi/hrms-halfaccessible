name: Supabase migrations

# Applies new files in supabase/migrations to the production database when they land on main.
# Vercel deploys the app from the same merge, so keep migrations backward-compatible
# (add tables/columns first, remove old ones in a later release).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token of an account with access to the project
#                          (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    project ref, the "xxxx" in https://xxxx.supabase.co
#   SUPABASE_DB_PASSWORD   the project's database password

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# never run two pushes against the database at once; queue them instead
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
